services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    networks:
      - mwo-network

  db:
    image: mysql:5.7
    platform: linux/amd64
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: mwo
      MYSQL_USER: mwo_user
      MYSQL_PASSWORD: mwo_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./daily-backup-Thu.sql:/docker-entrypoint-initdb.d/001-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mwo-network

volumes:
  mysql_data:

networks:
  mwo-network:
    driver: bridge
