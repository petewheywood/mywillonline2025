<!DOCTYPE html>
<html> 
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=10" />
    <meta http-equiv="Content-Language" content="en" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="google-site-verification" content="gxvOcm2nPJpyqvyro8sjOsLha5kPrTXesYA5zF_mRgw" />
    <script type="text/javascript" src="instafeed.min.js"></script>
  </head>
  <body>
    <style>
      #instafeed {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
      }
      #instafeed div {
        margin: 10px 10px 30px 10px;
        width: 200px;
      }
      img {
        border: 1px solid #000;
        height: 200px;
      }
    </style>
    <div id="instafeed"></div>
    
    <script type="text/javascript">
        var feed = new Instafeed({
          accessToken: 'IGQVJVVXZASaEhGY0hLUjBGOEpqcjJtY2p3aUZAnYVhvcWZAnZAU1CNlktNko0cDQwTTBKbGZAwdl9YUGV2aFRfMjRMRnc4MDkxWGhnRUtreFd0ME1rZA1ZAKWmVaREgtZAkEyeHVWd3dkZAlM1cE1ZAdXJiTVFFTAZDZD',
          filter: (data) => data.type === 'image',
          template: '<div><a href="{{link}}"><img title="{{caption}}" src="{{image}}" /></a><p>{{caption}}</p></div>',
          debug: true,
          limit: 4
        });
        feed.run();
    </script>
  </body>
</html>
